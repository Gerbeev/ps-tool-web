# Structured parse of job_definition.sample.jil plus its matching row in
# runtime_user_report.sample.yaml. Values are kept source-native on purpose.
source:
  scheduler: autosys
  environment: IUT

job:
  identity:
    job_name: IB_CT_CVA_1109_U1_DP_ADP_Accounts_Load
    job_type: CMD
    box_name: IB_CT_CVA_1109_U1_DP_ADP_Box

  definition:
    command: >-
      $$(1109_GV_U1_DP_Batch_TE)\RA.DataPlatform.TransformationEngine.Host.exe B
      /ES=$$(1109_GV_U1_Config)$$(1109_GV_U1_DP_ES_I)
      -m=RA.DataPlatform.Inventory.Modules.adp
      -c=adp-account-batch-datasource
      -CobDate=$$(1109_GV_U1_CVA_Date)
      LatestOnly=True
    machine: 1109_VM_CVA_Win_U1_Prim_S
    owner: svc_ra_uat@ubsprod
    permission: mx,gx
    date_conditions: 0
    condition: >-
      s(IB_CT_CVA_1109_U1_DP_ADP_ClearedPositions_Load) &
      s(IB_CT_CVA_1109_U1_DP_GMI_Accounts_Box)
    description: "Rerun=0;117;#IBCT Autosys;DL-CVA-IT-BATCH-ERROR"
    std_out_file: "$$(1109_GV_U1_CVA_Logs)\\$$(1109_GV_U1_CVA_Date)\\DataPlatform\\ADP\\Accounts\\%AUTO_JOB_NAME%.log"
    std_err_file: "$$(1109_GV_U1_CVA_Logs)\\$$(1109_GV_U1_CVA_Date)\\DataPlatform\\ADP\\Accounts\\%AUTO_JOB_NAME%.log"
    max_run_alarm: 17
    alarm_if_fail: 1
    profile: 1109_CVA_IUT
    alarm_if_terminated: 1
    timezone: London
    group: DP01
    application: 1109_APP_AT16831

  runtime_report:
    last_start_raw: "10/03/2026 05:27:52"
    last_end_raw: "10/03/2026 05:28:16"
    st_ex_raw: SU
    run_ntry_raw: "753378750/1"
    pri_xit_raw: "0"
    timezone_raw: London

comparison_relevant_observations:
  containment:
    source_field: box_name
    value: IB_CT_CVA_1109_U1_DP_ADP_Box
    meaning: structural_parent_only
  dependencies:
    source_field: condition
    expression: >-
      s(IB_CT_CVA_1109_U1_DP_ADP_ClearedPositions_Load) &
      s(IB_CT_CVA_1109_U1_DP_GMI_Accounts_Box)
    referenced_jobs:
      - IB_CT_CVA_1109_U1_DP_ADP_ClearedPositions_Load
      - IB_CT_CVA_1109_U1_DP_GMI_Accounts_Box
    required_state_raw: success
    boolean_operator: AND
  executable:
    source_field: command
    contains_autosys_global_variables: true
    referenced_global_variables:
      - 1109_GV_U1_DP_Batch_TE
      - 1109_GV_U1_Config
      - 1109_GV_U1_DP_ES_I
      - 1109_GV_U1_CVA_Date
  logs:
    stdout_and_stderr_same_template: true
    uses_auto_job_name_macro: true
  alarms:
    alarm_if_fail: 1
    alarm_if_terminated: 1
    max_run_alarm: 17
