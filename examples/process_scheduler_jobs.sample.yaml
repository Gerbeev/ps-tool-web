# Process Scheduler jobs with AutoSys-reference mapping blocks for migration parity.
scheduler: process_scheduler
topology_id: risk_daily_topology
jobs:
  - name: risk_daily_topology
    path: [risk_daily_topology]
    job_type: topology
    schedule:
      expression: "0 6 * * *"
      calendar: every_day
      timezone: Europe/Zurich
    autosys_reference:
      jil:
        job_name: RISK_DAILY_BOX
        job_type: BOX
        owner: risk_ops@zia-batch01
        permission: gx
        group: RISK
        application: RISK_ANALYTICS
        date_conditions: y
        start_times: "06:00"
        run_calendar: every_day
        timezone: Europe/Zurich
        alarm_if_fail: 1
        max_run_alarm: 120
        n_retrys: 0
        send_notification: N
      run:
        status: SUCCESS

  - name: RiskDaily.EtlJob
    path: [risk_daily_topology, RiskDaily.EtlJob]
    job_type: dotnet
    schedule:
      expression: "5 6 * * *"
      calendar: every_day
    command: "/opt/risk/bin/risk_etl.sh --business-date {BusinessDate}"
    condition: "Finish(RiskDaily.FileWaitIncoming)"
    log_paths:
      - /logs/ps/RiskDaily.EtlJob.out
      - /logs/ps/RiskDaily.EtlJob.err
    resolved_command: "/opt/risk/bin/risk_etl.sh --business-date 2026-10-02"
    resolved_parameters:
      BusinessDate: "2026-10-02"
    autosys_reference:
      jil:
        job_name: RISK_DAILY_ETL
        job_type: CMD
        box_name: RISK_DAILY_BOX
        machine: zia-batch01
        owner: risk_ops@zia-batch01
        permission: gx
        command: "/opt/risk/bin/risk_etl.sh --business-date $${BUSINESS_DATE}"
        condition: s(RISK_FILE_WAIT_INCOMING)
        date_conditions: y
        start_times: "06:05"
        run_calendar: every_day
        std_out_file: /logs/autosys/RISK_DAILY_ETL.out
        std_err_file: /logs/autosys/RISK_DAILY_ETL.err
        alarm_if_fail: 1
        max_run_alarm: 90
        n_retrys: 2
        send_notification: Y
        group: RISK
        application: RISK_ANALYTICS
      run:
        status: SUCCESS
        resolved_command: "/opt/risk/bin/risk_etl.sh --business-date 2026-10-02"
        global_variables:
          BUSINESS_DATE: "2026-10-02"

  - name: RiskDaily.FileWaitIncoming
    path: [risk_daily_topology, RiskDaily.FileWaitIncoming]
    job_type: file_wait
    schedule:
      raw: "offset_minutes: 1"
    command: "/data/incoming/RISK_{BusinessDate}.done"
    log_paths:
      - /logs/ps/RiskDaily.FileWaitIncoming.out
    resolved_command: "/data/incoming/RISK_2026-10-02.done"
    resolved_parameters:
      BusinessDate: "2026-10-02"
    autosys_reference:
      jil:
        job_name: RISK_FILE_WAIT_INCOMING
        job_type: FW
        box_name: RISK_DAILY_BOX
        machine: zia-batch01
        owner: risk_ops@zia-batch01
        permission: gx
        watch_file: "/data/incoming/RISK_$${BUSINESS_DATE}.done"
        watch_interval: 30
        watch_file_min_size: 0
        date_conditions: y
        start_mins: 1
        run_calendar: every_day
        std_out_file: /logs/autosys/RISK_FILE_WAIT_INCOMING.out
        alarm_if_fail: 1
        max_run_alarm: 30
        n_retrys: 0
        send_notification: N
        group: RISK
        application: RISK_ANALYTICS
      run:
        status: SUCCESS
        resolved_watch_file: /data/incoming/RISK_2026-10-02.done
        global_variables:
          BUSINESS_DATE: "2026-10-02"

  - name: RiskDaily.DotNetCalc
    path: [risk_daily_topology, RiskDaily.DotNetCalc]
    job_type: dotnet
    schedule:
      expression: "46 6 * * *"
      calendar: every_day
    command: "dotnet /opt/risk/RiskCalc.dll --mode daily --date {BusinessDate}"
    condition: "Finish(RiskDaily.EtlJob)"
    log_paths:
      - /logs/ps/RiskDaily.DotNetCalc.out
    resolved_command: "dotnet /opt/risk/RiskCalc.dll --mode daily --date 2026-10-02"
    resolved_parameters:
      BusinessDate: "2026-10-02"
    autosys_reference:
      jil:
        job_name: RISK_DOTNET_CALC
        job_type: CMD
        box_name: RISK_DAILY_BOX
        machine: zia-batch01
        owner: risk_ops@zia-batch01
        permission: gx
        command: "dotnet /opt/risk/RiskCalc.dll --mode daily --date $${BUSINESS_DATE}"
        condition: s(RISK_DAILY_ETL)
        date_conditions: y
        start_times: "06:46"
        run_calendar: every_day
        std_out_file: /logs/autosys/RISK_DOTNET_CALC.out
        std_err_file: /logs/autosys/RISK_DOTNET_CALC.err
        alarm_if_fail: 1
        max_run_alarm: 60
        n_retrys: 1
        send_notification: N
        group: RISK
        application: RISK_ANALYTICS
      run:
        status: SUCCESS
        resolved_command: "dotnet /opt/risk/RiskCalc.dll --mode daily --date 2026-10-02"
        global_variables:
          BUSINESS_DATE: "2026-10-02"

  - name: RiskDaily.ReconJob
    path: [risk_daily_topology, RiskDaily.ReconJob]
    job_type: dotnet
    schedule:
      expression: "50 6 * * *"
      calendar: every_day
    command: "/opt/risk/bin/recon.sh --date {BusinessDate}"
    condition: "Finish(RiskDaily.DotNetCalc)"
    log_paths:
      - /logs/ps/RiskDaily.ReconJob.out
      - /logs/ps/RiskDaily.ReconJob.err
    resolved_command: "/opt/risk/bin/recon.sh --date 2026-10-02"
    resolved_parameters:
      BusinessDate: "2026-10-02"
    autosys_reference:
      jil:
        job_name: RISK_DAILY_RECON
        job_type: CMD
        box_name: RISK_DAILY_BOX
        machine: zia-batch01
        owner: risk_ops@zia-batch01
        permission: gx
        command: "/opt/risk/bin/recon.sh --date $${BUSINESS_DATE}"
        condition: s(RISK_DOTNET_CALC)
        date_conditions: y
        start_times: "06:50"
        run_calendar: every_day
        std_out_file: /logs/autosys/RISK_DAILY_RECON.out
        std_err_file: /logs/autosys/RISK_DAILY_RECON.err
        alarm_if_fail: 1
        max_run_alarm: 45
        n_retrys: 1
        send_notification: Y
        group: RISK
        application: RISK_ANALYTICS
      run:
        status: SUCCESS
        resolved_command: "/opt/risk/bin/recon.sh --date 2026-10-02"
        global_variables:
          BUSINESS_DATE: "2026-10-02"

  - name: RiskDaily.PostProcess
    path: [risk_daily_topology, RiskDaily.PostProcess]
    job_type: dotnet
    schedule:
      expression: "0 7 * * *"
      calendar: every_day
    command: "dotnet /opt/risk/PostProcess.dll"
    condition: "Finish(RiskDaily.ReconJob)"
    log_paths:
      - /logs/ps/RiskDaily.PostProcess.log
    autosys_reference:
      jil:
        job_name: RISK_POST_PROCESS
        job_type: CMD
        box_name: RISK_DAILY_BOX
        machine: zia-batch01
        command: "dotnet /opt/risk/PostProcess.dll"
        condition: s(RISK_DAILY_RECON)
        date_conditions: y
        start_times: "07:00"
        run_calendar: every_day
      run:
        status: PENDING

  - name: RiskDaily.AdHocCheck
    path: [RiskDaily.AdHocCheck]
    job_type: cmd
    schedule:
      raw: on_demand
    command: "/opt/risk/bin/adhoc_check.sh"
    log_paths:
      - /logs/ps/RiskDaily.AdHocCheck.log
    autosys_reference:
      jil:
        job_name: RISK_ADHOC_CHECK
        job_type: CMD
        machine: zia-batch01
        command: "/opt/risk/bin/adhoc_check.sh"
        date_conditions: n
      run:
        status: NOT_RUN
