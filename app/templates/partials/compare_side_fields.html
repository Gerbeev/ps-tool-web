<input type="hidden" name="{{ side }}_scheduler" id="compare-{{ side }}-scheduler" value="{{ scheduler }}">
<p class="small muted compare-scheduler-note">{{ scheduler_label }}</p>
{% if scheduler == 'process_scheduler' %}
<label class="browse-field-stack">
  <span class="browse-field-label">Topology</span>
  <select name="{{ side }}_topology" id="compare-{{ side }}-topology" class="app-control">
    {% for t in topologies %}
    <option value="{{ t }}" {% if t == topology %}selected{% endif %}>{{ t }}</option>
    {% endfor %}
    {% if not topologies %}
    <option value="">(no topologies)</option>
    {% endif %}
  </select>
</label>
<input type="hidden" name="{{ side }}_as_of" value="{{ as_of }}">
{% else %}
<label class="browse-field-stack">
  <span class="browse-field-label">Business date</span>
  <input type="date"
         name="{{ side }}_as_of"
         id="compare-{{ side }}-as-of"
         class="app-control"
         value="{{ as_of }}">
</label>
<input type="hidden" name="{{ side }}_topology" value="">
{% endif %}
