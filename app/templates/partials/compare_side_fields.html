<label class="box-field-stack">
  <span class="box-field-label">Snapshot</span>
  <select name="{{ side }}_snapshot_id" id="compare-{{ side }}-snapshot" class="app-control" {% if not snapshots %}disabled{% endif %}>
    {% for item in snapshots %}
    <option value="{{ item.snapshot_id }}" {% if item.snapshot_id == selected_snapshot_id %}selected{% endif %}>{{ item.label }}</option>
    {% endfor %}
    {% if not snapshots %}
    <option value="">(no generated snapshots)</option>
    {% endif %}
  </select>
</label>
{% if not snapshots %}
<p class="small muted box-note">Generate a snapshot for this environment in <a href="/snapshots">Snapshots</a>.</p>
{% else %}
<p class="small muted box-note">Comparison uses this frozen snapshot only.</p>
{% endif %}
