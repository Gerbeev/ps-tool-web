<div class="browse-filters compare-table-filters">
  <label class="box-field-stack compare-filter-field-search">
    <span class="box-field-label">Search</span>
    <input type="text"
           id="compare-filter-search"
           class="browse-filter-input app-control"
           placeholder="Filter by job name or logical id…"
           inputmode="search"
           autocomplete="off"
           aria-controls="compare-table-body">
  </label>
  <div class="box-field-stack compare-filter-field-category">
    <span class="box-field-label">Row type</span>
    <div class="browse-status-picker" id="compare-filter-categories">
      <button type="button"
              id="compare-category-picker-trigger"
              class="browse-status-picker-trigger app-control app-control--picker"
              aria-expanded="false"
              aria-haspopup="dialog"
              aria-controls="compare-category-picker-popover">
        <span id="compare-category-picker-label" class="browse-status-picker-label">All rows</span>
      </button>
      <div id="compare-category-picker-popover"
           class="browse-status-picker-popover"
           role="dialog"
           aria-label="Filter by row type"
           hidden>
        <div class="browse-status-picker-actions">
          <button type="button" class="browse-status-picker-action" data-category-preset="all">Reset</button>
          <button type="button" class="browse-status-picker-action" data-category-preset="mismatches">Diffs only</button>
        </div>
        <ul class="browse-status-picker-list">
          <li>
            <label class="browse-status-picker-row">
              <input type="checkbox" class="compare-category-checkbox" value="matched">
              <span class="browse-status-picker-row-label">Paired jobs</span>
            </label>
          </li>
          <li>
            <label class="browse-status-picker-row">
              <input type="checkbox" class="compare-category-checkbox" value="status_delta">
              <span class="browse-status-picker-row-label">Status Δ</span>
            </label>
          </li>
          <li>
            <label class="browse-status-picker-row">
              <input type="checkbox" class="compare-category-checkbox" value="left_only">
              <span class="browse-status-picker-row-label">Left only</span>
            </label>
          </li>
          <li>
            <label class="browse-status-picker-row">
              <input type="checkbox" class="compare-category-checkbox" value="right_only">
              <span class="browse-status-picker-row-label">Right only</span>
            </label>
          </li>
          <li>
            <label class="browse-status-picker-row">
              <input type="checkbox" class="compare-category-checkbox" value="param_delta">
              <span class="browse-status-picker-row-label">Parameter Δ</span>
            </label>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <label class="box-field-stack compare-filter-field-limit">
    <span class="box-field-label">Page size</span>
    <select id="compare-filter-limit" class="app-control" aria-label="Rows per page">
      <option value="0">All</option>
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="250">250</option>
    </select>
  </label>
</div>
