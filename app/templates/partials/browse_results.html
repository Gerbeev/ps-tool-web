<input type="hidden" id="session-id" name="session_id" value="{{ session_id }}">
<header class="browse-results-head browse-box__section browse-box__pad">
  <p class="browse-meta"><strong>{{ meta_line }}</strong> · {{ snapshot.flat_jobs|length }} jobs</p>
</header>
<div id="browse-workspace" class="browse-workspace browse-box__section">
  <div class="browse-tree-column">
    <div class="browse-tree-wrap">
      {% with snapshot=snapshot, side='browse', session_id=session_id, job_api_base='/api/browse/job', tree_api_base='/api/browse/tree', tree_layout='browse' %}
      {% include "partials/tree_side.html" %}
      {% endwith %}
    </div>
  </div>
  <aside id="job-detail-panel" class="browse-detail-panel" aria-live="polite"></aside>
</div>
<div id="browse-panel-backdrop" class="browse-panel-backdrop" hidden aria-hidden="true"></div>
<script src="/static/js/browse-filters.js"></script>
<script>
  (function () {
    var search = document.getElementById('global-search');
    if (search) {
      search.disabled = false;
      search.placeholder = 'Search jobs in this browse… (Ctrl+K)';
    }
    window.psBrowseOpenPanel = function (row) {
      var workspace = document.getElementById('browse-workspace');
      var backdrop = document.getElementById('browse-panel-backdrop');
      if (workspace) workspace.classList.add('browse-panel-open');
      if (backdrop) backdrop.removeAttribute('hidden');
      document.querySelectorAll('.browse-job-row.is-selected').forEach(function (el) {
        el.classList.remove('is-selected');
      });
      if (row) row.classList.add('is-selected');
    };
    window.psBrowseClosePanel = function () {
      var panel = document.getElementById('job-detail-panel');
      var workspace = document.getElementById('browse-workspace');
      var backdrop = document.getElementById('browse-panel-backdrop');
      if (panel) panel.innerHTML = '';
      if (workspace) workspace.classList.remove('browse-panel-open');
      if (backdrop) backdrop.setAttribute('hidden', '');
      document.querySelectorAll('.browse-job-row.is-selected').forEach(function (el) {
        el.classList.remove('is-selected');
      });
    };
    var backdrop = document.getElementById('browse-panel-backdrop');
    if (backdrop) {
      backdrop.addEventListener('click', window.psBrowseClosePanel);
    }
    if (window.psBrowseFiltersInit) {
      window.psBrowseFiltersInit();
    }
  })();
</script>
