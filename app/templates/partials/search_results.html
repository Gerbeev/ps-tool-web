{% if hits %}
<ul class="search-hit-list">
  {% for hit in hits %}
  <li>
    <span class="badge side-{{ hit.side }}">{{ hit.side }}</span>
    <strong>{{ hit.scheduler_job_name }}</strong>
    <small>{{ hit.path }} · {{ hit.status }}</small>
    <div class="snippet">{{ hit.snippet }}</div>
  </li>
  {% endfor %}
</ul>
{% elif query %}
<p class="muted">No matches for «{{ query }}»</p>
{% endif %}
