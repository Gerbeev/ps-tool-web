<label class="box-field-stack">
  <span class="box-field-label">Snapshot</span>
  <select name="snapshot_id" id="browse-snapshot" class="app-control" {% if not snapshots %}disabled{% endif %}>
    {% for item in snapshots %}
    <option value="{{ item.snapshot_id }}" {% if item.snapshot_id == selected_snapshot_id %}selected{% endif %}>{{ item.label }}</option>
    {% endfor %}
    {% if not snapshots %}
    <option value="">(no generated snapshots)</option>
    {% endif %}
  </select>
</label>
{% if snapshots %}
<p class="small muted box-note">Newest snapshot is selected by default. No source-system call is made here.</p>
{% else %}
<p class="small muted box-note">No snapshot exists for this environment. Generate one in <a href="/snapshots">Snapshots</a>.</p>
{% endif %}
