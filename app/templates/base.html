<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ps-tool-web{% endblock %}</title>
  <script>
    (function () {
      var stored = localStorage.getItem('ps-tool-theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      var collapsed = localStorage.getItem('ps-tool-sidebar') === 'collapsed';
      if (collapsed) document.documentElement.classList.add('sidebar-collapsed');
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/css/custom.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <div class="app-shell">
    <aside id="app-sidebar" class="app-sidebar" aria-label="Main navigation">
      <div class="sidebar-header">
        <button type="button" id="sidebar-toggle" class="app-logo-toggle" aria-label="Toggle navigation sidebar" aria-controls="app-sidebar" aria-expanded="true">
          <span class="logo-icon" aria-hidden="true">
            <svg class="logo-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.75"/>
              <rect x="13" y="3" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.75"/>
              <rect x="3" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.75"/>
              <rect x="13" y="13" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.75"/>
            </svg>
          </span>
          <span class="logo-text">Comparison Tool</span>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="/browse" class="nav-item {% if active_nav == 'browse' %}active{% endif %}" title="Browse">
          <span class="nav-icon" aria-hidden="true">◎</span>
          <span class="nav-label">Browse</span>
        </a>
        <a href="/compare" class="nav-item {% if active_nav == 'compare' %}active{% endif %}" title="Compare">
          <span class="nav-icon" aria-hidden="true">⇄</span>
          <span class="nav-label">Compare</span>
        </a>
        <a href="/settings" class="nav-item {% if active_nav == 'settings' %}active{% endif %}" title="Settings">
          <span class="nav-icon" aria-hidden="true">⚙</span>
          <span class="nav-label">Settings</span>
        </a>
      </nav>
    </aside>
    <div class="app-main">
      <header class="app-topbar">
        <div class="search-bar">
          <input type="search"
                 id="global-search"
                 name="q"
                 placeholder="Search jobs… (Ctrl+K)"
                 hx-get="/api/search"
                 hx-trigger="keyup changed delay:300ms, search"
                 hx-target="#search-results"
                 hx-include="#global-search"
                 autocomplete="off">
          <div id="search-results" class="search-dropdown"></div>
        </div>
        <div class="topbar-end">
          <button type="button" id="theme-toggle" class="icon-btn theme-toggle" aria-label="Toggle light/dark theme">
            <span class="theme-icon-light" aria-hidden="true">☀</span>
            <span class="theme-icon-dark" aria-hidden="true">☾</span>
          </button>
        </div>
      </header>
      <main class="app-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script src="/static/js/app-shell.js"></script>
  <script>
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('global-search').focus();
      }
    });
  </script>
</body>
</html>
